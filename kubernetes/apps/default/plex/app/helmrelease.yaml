---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  chartRef:
    kind: OCIRepository
    name: plex
  interval: 1h
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.5.11079@sha256:06ef0fc23e9af9bbaf284c3f27972f94e703d13d6f745edeb6818fcbebf6c673
            env:
              TZ: Europe/London
              PLEX_ADVERTISE_URL: https://plex.${SECRET_DOMAIN}:443,http://10.0.30.35:32400,http://plex.default.svc.cluster.local:32400
              PLEX_NO_AUTH_NETWORKS: 192.168.167.0/24,10.0.10.0/24,10.0.11.0/24
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: &port 32400
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 5Gi
    defaultPodOptions:
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: plex
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
        supplementalGroups:
          - 44
          - 109
          - 1001
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.30.35
        externalTrafficPolicy: Local
        ports:
          http:
            port: *port
    # rawResources:
    #   gpu:
    #     apiVersion: resource.k8s.io/v1
    #     kind: ResourceClaimTemplate
    #     spec:
    #       spec:
    #         spec:
    #           devices:
    #             requests:
    #               - name: gpu
    #                 exactly:
    #                   deviceClassName: gpu.intel.com
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - # Ref: https://forums.plex.tv/t/external-srt-subtitles-are-not-working-w-reverse-proxy/886540
            backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - Range
            matches:
              - path:
                  type: PathPrefix
                  value: /library/streams
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      nfs-movies:
        type: nfs
        server: "10.0.30.2"
        path: "/mnt/ApeVault/Movies"
        advancedMounts:
          plex:
            app:
              - path: /media-movies
                readOnly: true
      nfs-cfmovies:
        type: nfs
        server: "10.0.30.2"
        path: "/mnt/ApeVault/CFMovies"
        advancedMounts:
          plex:
            app:
              - path: /media-cfmovies
                readOnly: true
      nfs-cftvshows:
        type: nfs
        server: "10.0.30.2"
        path: "/mnt/ApeVault/CFTVShows"
        advancedMounts:
          plex:
            app:
              - path: /media-cftvshows
                readOnly: true
      nfs-tvshows:
        type: nfs
        server: "10.0.30.2"
        path: "/mnt/ApeVault/TVShows"
        advancedMounts:
          plex:
            app:
              - path: /media-tvshows
                readOnly: true
      media:
        type: nfs
        server: "10.0.30.2"
        path: /mnt/ApeVault/Media
        globalMounts:
          - path: /media
            readOnly: true
      tmp:
        type: emptyDir
